<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2440" viewBox="0 0 1800 2440" role="img" aria-labelledby="title description">
<title id="title">Making relational public services ordinary</title><desc id="description">An expanded practice map based on the TRIP26 infographic and the 8 October workshop. It connects a person's account, the loss of meaning in records, protected relational practice, governing conditions, authority and assurance, and tests for enduring change. Asha is fictional. All proposed interventions require real agreement.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#99141B"/></marker></defs>
<rect width="1800" height="2440" fill="#FFFFFF"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif} .bold{font-weight:700}</style>
<rect x="0" y="0" width="1800" height="18" rx="0" fill="#99141B"/>
<text x="60" y="77" font-size="24" fill="#99141B" font-weight="700">BENJAMIN P TAYLOR  /  RedQuadrant</text>
<text x="60" y="165" font-size="70" fill="#3E0908" font-weight="700">Making relational</text>
<text x="60" y="246" font-size="70" fill="#3E0908" font-weight="700">public services ordinary</text>
<text x="62" y="295" font-size="27" fill="#161313">Follow one situation into decisions, then change the conditions around the work.</text>
<rect x="60" y="327" width="818" height="121" rx="0" fill="#FAF6F3"/>
<rect x="904" y="327" width="836" height="121" rx="0" fill="#FAF6F3"/>
<text x="83" y="369" font-size="21" fill="#99141B" font-weight="700">JOB 1</text>
<text x="83" y="414.0" font-size="29" fill="#161313" font-weight="700">Improve what happens in the person&#x27;s life.</text>
<text x="927" y="369" font-size="21" fill="#99141B" font-weight="700">JOB 2</text>
<text x="927" y="401" font-size="27" fill="#161313" font-weight="700">Change the conditions that let useful practice</text>
<text x="927" y="433" font-size="27" fill="#161313" font-weight="700">endure.</text>
<rect x="60" y="468" width="38" height="38" rx="0" fill="#99141B"/>
<text x="70" y="496" font-size="25" fill="#FFFFFF" font-weight="700">1</text>
<text x="114" y="496" font-size="32" fill="#3E0908" font-weight="700">Keep the person&#x27;s purpose visible</text>
<rect x="60" y="519" width="552" height="228" rx="10" fill="#FFFFFF" stroke="#A7A8AA" stroke-width="1.6"/>
<text x="82" y="559" font-size="26" fill="#99141B" font-weight="700">The person&#x27;s account</text>
<text x="82" y="600" font-size="24" fill="#161313">&#x27;I want to keep my job and stay near my</text>
<text x="82" y="632" font-size="24" fill="#161313">sister. The damp is making my son&#x27;s</text>
<text x="82" y="664" font-size="24" fill="#161313">breathing worse. Repairs appointments</text>
<text x="82" y="696" font-size="24" fill="#161313">clash with my shifts. I&#x27;ve told three</text>
<text x="82" y="728" font-size="24" fill="#161313">teams.&#x27;</text>
<path d="M613,630 L631,630" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="634" y="519" width="552" height="228" rx="10" fill="#FFFFFF" stroke="#A7A8AA" stroke-width="1.6"/>
<text x="656" y="559" font-size="26" fill="#99141B" font-weight="700">The service record</text>
<text x="656" y="600" font-size="24" fill="#161313">Repair logged. Appointment offered.</text>
<text x="656" y="632" font-size="24" fill="#161313">Tenant unavailable. Appointment</text>
<text x="656" y="664" font-size="24" fill="#161313">rearranged. Advice referral made.</text>
<text x="656" y="696" font-size="24" fill="#161313">Advised to contact the GP.</text>
<path d="M1187,630 L1205,630" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1208" y="519" width="552" height="228" rx="10" fill="#FFFFFF" stroke="#A7A8AA" stroke-width="1.6"/>
<text x="1230" y="559" font-size="26" fill="#99141B" font-weight="700">The management report</text>
<text x="1230" y="600" font-size="24" fill="#161313">Request responded to within target.</text>
<text x="1230" y="632" font-size="24" fill="#161313">Referral completed. No unresolved action</text>
<text x="1230" y="664" font-size="24" fill="#161313">assigned to this team. Case closed.</text>
<text x="62" y="779" font-size="25" fill="#3E0908">Fictional case: completion of a task does not establish resolution. Who now carries the joining-up work?</text>
<rect x="60" y="810" width="38" height="38" rx="0" fill="#99141B"/>
<text x="70" y="838" font-size="25" fill="#FFFFFF" font-weight="700">2</text>
<text x="114" y="838" font-size="32" fill="#3E0908" font-weight="700">Follow the work beyond the protected team</text>
<rect x="60" y="863" width="466" height="401" rx="0" fill="#FAF6F3"/>
<text x="82" y="906" font-size="28" fill="#3E0908" font-weight="700">Four layers to examine</text>
<rect x="82" y="918" width="34" height="36" rx="0" fill="#FFFFFF" stroke="#99141B" stroke-width="1.6"/>
<text x="91" y="945" font-size="24" fill="#99141B" font-weight="700">1</text>
<text x="129" y="945" font-size="24" fill="#161313">Service around the person</text>
<rect x="82" y="979" width="34" height="36" rx="0" fill="#FFFFFF" stroke="#99141B" stroke-width="1.6"/>
<text x="91" y="1006" font-size="24" fill="#99141B" font-weight="700">2</text>
<text x="129" y="1006" font-size="24" fill="#161313">Coordinating capability</text>
<rect x="82" y="1040" width="34" height="36" rx="0" fill="#FFFFFF" stroke="#99141B" stroke-width="1.6"/>
<text x="91" y="1067" font-size="24" fill="#99141B" font-weight="700">3</text>
<text x="129" y="1067" font-size="24" fill="#161313" font-weight="700">Governance ceiling</text>
<rect x="82" y="1101" width="34" height="36" rx="0" fill="#FFFFFF" stroke="#99141B" stroke-width="1.6"/>
<text x="91" y="1128" font-size="24" fill="#99141B" font-weight="700">4</text>
<text x="129" y="1128" font-size="24" fill="#161313" font-weight="700">Organisational defences</text>
<text x="82" y="1225" font-size="23" fill="#161313">Changes at the first two layers may</text>
<text x="82" y="1254" font-size="23" fill="#161313">leave the last two untouched.</text>
<rect x="546" y="863" width="698" height="401" rx="10" fill="#FFFFFF" stroke="#A7A8AA" stroke-width="1.6"/>
<text x="568" y="906" font-size="28" fill="#3E0908" font-weight="700">A recurring pattern to test</text>
<rect x="568" y="934" width="202" height="125" rx="4" fill="#FAF6F3"/>
<text x="580" y="964" font-size="21" fill="#99141B" font-weight="700">Useful work</text>
<text x="580" y="996" font-size="20" fill="#161313">A response fits</text>
<text x="580" y="1022" font-size="20" fill="#161313">the situation.</text>
<rect x="792" y="934" width="202" height="125" rx="4" fill="#FAF6F3"/>
<text x="804" y="964" font-size="21" fill="#99141B" font-weight="700">Protected pilot</text>
<text x="804" y="996" font-size="20" fill="#161313">Special</text>
<text x="804" y="1022" font-size="20" fill="#161313">permission or</text>
<text x="804" y="1048" font-size="20" fill="#161313">funding.</text>
<rect x="1016" y="934" width="202" height="125" rx="4" fill="#FAF6F3"/>
<text x="1028" y="964" font-size="21" fill="#99141B" font-weight="700">Target and scale</text>
<text x="1028" y="996" font-size="20" fill="#161313">Pressure to prove</text>
<text x="1028" y="1022" font-size="20" fill="#161313">and replicate.</text>
<rect x="1016" y="1100" width="202" height="125" rx="4" fill="#FAF6F3"/>
<text x="1028" y="1130" font-size="21" fill="#99141B" font-weight="700">Different logics</text>
<text x="1028" y="1162" font-size="20" fill="#161313">Judgement meets</text>
<text x="1028" y="1188" font-size="20" fill="#161313">demands for</text>
<text x="1028" y="1214" font-size="20" fill="#161313">legibility.</text>
<rect x="792" y="1100" width="202" height="125" rx="4" fill="#FAF6F3"/>
<text x="804" y="1130" font-size="21" fill="#99141B" font-weight="700">Pressure returns</text>
<text x="804" y="1162" font-size="20" fill="#161313">Budget, risk, or</text>
<text x="804" y="1188" font-size="20" fill="#161313">sponsorship</text>
<text x="804" y="1214" font-size="20" fill="#161313">changes.</text>
<rect x="568" y="1100" width="202" height="125" rx="4" fill="#FAF6F3"/>
<text x="580" y="1130" font-size="21" fill="#99141B" font-weight="700">Reversion</text>
<text x="580" y="1162" font-size="20" fill="#161313">Collapse,</text>
<text x="580" y="1188" font-size="20" fill="#161313">hardening, or</text>
<text x="580" y="1214" font-size="20" fill="#161313">heroic work.</text>
<path d="M771,994 L789,994" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M996,994 L1013,994" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1117,1063 L1117,1095" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1012,1161 L996,1161" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M788,1161 L772,1161" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M564,1160 L555,1160 L555,994 L565,994" fill="none" stroke="#99141B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="655" y="1087" font-size="22" fill="#3E0908">What changed in the ordinary rules?</text>
<rect x="1264" y="863" width="476" height="401" rx="0" fill="#FAF6F3"/>
<text x="1286" y="906" font-size="28" fill="#3E0908" font-weight="700">People under pressure</text>
<text x="1286" y="945" font-size="23" fill="#99141B" font-weight="700">Frontline workers</text>
<text x="1286" y="976" font-size="22" fill="#161313">Carry complexity and hidden work.</text>
<text x="1286" y="1017" font-size="23" fill="#99141B" font-weight="700">Managers</text>
<text x="1286" y="1048" font-size="22" fill="#161313">Need workable accounts of risk.</text>
<text x="1286" y="1089" font-size="23" fill="#99141B" font-weight="700">Advocates</text>
<text x="1286" y="1120" font-size="22" fill="#161313">Can become caught in opposition.</text>
<text x="1286" y="1161" font-size="23" fill="#99141B" font-weight="700">Leaders</text>
<text x="1286" y="1192" font-size="22" fill="#161313">Must hold competing obligations.</text>
<text x="1286" y="1240" font-size="21" fill="#3E0908">Possible patterns, not diagnoses.</text>
<rect x="60" y="1294" width="38" height="38" rx="0" fill="#99141B"/>
<text x="70" y="1322" font-size="25" fill="#FFFFFF" font-weight="700">3</text>
<text x="114" y="1322" font-size="32" fill="#3E0908" font-weight="700">Choose a response that fits the demand</text>
<rect x="60" y="1347" width="818" height="182" rx="10" fill="#FFFFFF" stroke="#A7A8AA" stroke-width="1.6"/>
<text x="83" y="1385" font-size="26" fill="#99141B" font-weight="700">Form of response</text>
<text x="83" y="1425" font-size="26" fill="#161313" font-weight="700">Standardised / tailored / coordinated / open</text>
<text x="83" y="1460" font-size="26" fill="#161313" font-weight="700">relational</text>
<text x="83" y="1500" font-size="23" fill="#161313">How far can the situation change the response or the task?</text>
<rect x="904" y="1347" width="836" height="182" rx="10" fill="#FFFFFF" stroke="#A7A8AA" stroke-width="1.6"/>
<text x="927" y="1385" font-size="26" fill="#99141B" font-weight="700">Where capability and risk are held</text>
<text x="927" y="1425" font-size="26" fill="#161313" font-weight="700">Encounter / service / system conditions / place /</text>
<text x="927" y="1460" font-size="26" fill="#161313" font-weight="700">citizen space</text>
<text x="927" y="1500" font-size="23" fill="#161313">Citizen association is not just a larger service partnership.</text>
<text x="62" y="1563" font-size="25" fill="#3E0908">No maturity score. Test health and fit; preserve rights, fair treatment, and proportionate authority.</text>
<rect x="60" y="1596" width="38" height="38" rx="0" fill="#99141B"/>
<text x="70" y="1624" font-size="25" fill="#FFFFFF" font-weight="700">4</text>
<text x="114" y="1624" font-size="32" fill="#3E0908" font-weight="700">Find one governing condition that needs to change</text>
<rect x="60" y="1650" width="552" height="86" rx="0" fill="#FAF6F3"/>
<text x="78" y="1683" font-size="25" fill="#99141B" font-weight="700">Boundary</text>
<text x="78" y="1717" font-size="23" fill="#161313">Whose situation counts?</text>
<rect x="634" y="1650" width="552" height="86" rx="0" fill="#FAF6F3"/>
<text x="652" y="1683" font-size="25" fill="#99141B" font-weight="700">Demand</text>
<text x="652" y="1717" font-size="23" fill="#161313">What are people asking for?</text>
<rect x="1208" y="1650" width="552" height="86" rx="0" fill="#FAF6F3"/>
<text x="1226" y="1683" font-size="25" fill="#99141B" font-weight="700">Authority</text>
<text x="1226" y="1717" font-size="23" fill="#161313">Who can decide?</text>
<rect x="60" y="1750" width="552" height="86" rx="0" fill="#FAF6F3"/>
<text x="78" y="1783" font-size="25" fill="#99141B" font-weight="700">Capability</text>
<text x="78" y="1817" font-size="23" fill="#161313">What support can be used?</text>
<rect x="634" y="1750" width="552" height="86" rx="0" fill="#FAF6F3"/>
<text x="652" y="1783" font-size="25" fill="#99141B" font-weight="700">Measurement</text>
<text x="652" y="1817" font-size="23" fill="#161313">What drives the response?</text>
<rect x="1208" y="1750" width="552" height="86" rx="0" fill="#FAF6F3"/>
<text x="1226" y="1783" font-size="25" fill="#99141B" font-weight="700">Sustainment</text>
<text x="1226" y="1817" font-size="23" fill="#161313">What survives a change of sponsor?</text>
<rect x="60" y="1859" width="38" height="38" rx="0" fill="#99141B"/>
<text x="70" y="1887" font-size="25" fill="#FFFFFF" font-weight="700">5</text>
<text x="114" y="1887" font-size="32" fill="#3E0908" font-weight="700">Build a loop that can change the next encounter</text>
<rect x="60" y="1912" width="407" height="105" rx="4" fill="#3E0908"/>
<text x="78" y="1952" font-size="24" fill="#FFFFFF" font-weight="700">Person&#x27;s evidence</text>
<text x="78" y="1987" font-size="21" fill="#FFFFFF">Purpose and experience</text>
<path d="M469,1964 L484,1964" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="487" y="1912" width="407" height="105" rx="4" fill="#3E0908"/>
<text x="505" y="1952" font-size="24" fill="#FFFFFF" font-weight="700">Authorised review</text>
<text x="505" y="1987" font-size="21" fill="#FFFFFF">People, roles, and resources</text>
<path d="M896,1964 L911,1964" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="914" y="1912" width="407" height="105" rx="4" fill="#3E0908"/>
<text x="932" y="1952" font-size="24" fill="#FFFFFF" font-weight="700">Decision and action</text>
<text x="932" y="1987" font-size="21" fill="#FFFFFF">Response or rule can change</text>
<path d="M1323,1964 L1338,1964" fill="none" stroke="#99141B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1341" y="1912" width="407" height="105" rx="4" fill="#3E0908"/>
<text x="1359" y="1952" font-size="24" fill="#FFFFFF" font-weight="700">Return and learn</text>
<text x="1359" y="1987" font-size="21" fill="#FFFFFF">Check the next encounter</text>
<path d="M1570,2018 L1570,2033 L255,2033 L255,2019" fill="none" stroke="#99141B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="62" y="2066" font-size="26" fill="#99141B" font-weight="700">The centre needs assurance. The edge needs authority. Both need learning that changes decisions.</text>
<rect x="60" y="2091" width="38" height="38" rx="0" fill="#99141B"/>
<text x="70" y="2119" font-size="25" fill="#FFFFFF" font-weight="700">6</text>
<text x="114" y="2119" font-size="32" fill="#3E0908" font-weight="700">Test the work and the arrangement that sustains it</text>
<rect x="60" y="2143" width="818" height="141" rx="0" fill="#FAF6F3"/>
<text x="82" y="2183" font-size="26" fill="#99141B" font-weight="700">Operational test</text>
<text x="82" y="2224" font-size="25" fill="#161313">If we change the work, what do we expect for the person,</text>
<text x="82" y="2257" font-size="25" fill="#161313">and what evidence would show it?</text>
<rect x="904" y="2143" width="836" height="141" rx="0" fill="#FAF6F3"/>
<text x="927" y="2183" font-size="26" fill="#99141B" font-weight="700">Institutional test</text>
<text x="927" y="2224" font-size="25" fill="#161313">Who can authorise and retain the change? Agree scope,</text>
<text x="927" y="2257" font-size="25" fill="#161313">resources, a review, and stop or revise conditions.</text>
<text x="62" y="2323" font-size="25" fill="#3E0908">Test what survives the worker, sponsor, or funding leaving. Reopen what your own map leaves out.</text>
<text x="62" y="2372" font-size="22" fill="#161313">Different arrangements may help: stable bubble, alliance, pooled model, modular change, or incremental reform.</text>
<text x="62" y="2412" font-size="20" fill="#99141B">TRIP26 slide 4 + 8 October 2026 workshop + Taylor–Boxer work  |  antlerboy.com/sysprac26/relational/</text>
</svg>