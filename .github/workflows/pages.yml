name: Publish antlerboy.com
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Add the systems practice collection and catalogue records
        run: python3 scripts/add-systems-practice.py
      - name: Add September publications
        run: python3 scripts/add-september-publications.py
      - name: Add the SCiO practice accounts
        run: python3 scripts/add-scio-case-studies.py
      - name: Build the individual large-group method index
        run: python3 scripts/build-large-group-index.py
      - name: Restore verified TRIP26 source image
        uses: actions/cache@v4
        with:
          path: build-cache
          key: trip26-original-34981a69cad81b153b59117e5b548877ba5edbc71c7fdf492bf6f5b33f96dc93
      - name: Prepare static site
        run: |
          python3 scripts/build-flawfulconsulting.py
          mkdir -p _site
          cp index.html _site/index.html
          cp 404.html _site/404.html
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          cp CNAME _site/CNAME
          cp -R assets _site/assets
          cp -R library _site/library
          cp -R toolshed _site/toolshed
          cp -R conversations _site/conversations
          cp -R sysprac26 _site/sysprac26
          cp -R flawfulconsulting _site/flawfulconsulting
          cp practice-rules.js _site/practice-rules.js
          touch _site/.nojekyll
          test -s _site/sysprac26/relational/index.html
      - name: Include the unchanged TRIP26 infographic and workshop extension
        run: |
          python3 -m venv /tmp/relational-python
          /tmp/relational-python/bin/pip install pymupdf==1.26.7 cairosvg==2.8.2
          /tmp/relational-python/bin/python scripts/build-relational-visual.py _site
      - name: Refresh public catalogues
        run: node scripts/build-public-catalogues.mjs _site/library
      - name: Keep feedback shortcut on every generated page
        run: python3 scripts/ensure-feedback.py _site
      - name: Add first-party visit analytics to every page
        run: python3 scripts/inject-visit-analytics.py _site
      - name: Install pinned browser test runner
        run: |
          npm install --prefix /tmp/practice-browser --no-save playwright@1.55.0
          /tmp/practice-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check library navigation, catalogue, search and mobile layout
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
        run: node scripts/test-practice-library.js
      - name: Check systemic consulting guide and downloads
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
        run: node scripts/test-flawfulconsulting.js
      - name: Check relational page, original infographic, and working tool
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
        run: node scripts/test-relational-guide.js
      - name: Record publication identity
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('_site/library/practice-publication.json').write_text(json.dumps({'commit':os.environ['DEPLOY_COMMIT'],'resource':'systems-methods-practice','status':'alpha'},indent=2)+'\n')
          PY
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-library-build-check
          path: validation/practice-library
          if-no-files-found: ignore
      - name: Preserve relational build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-build-check
          path: validation/relational
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned browser test runner
        run: |
          npm install --prefix /tmp/practice-browser --no-save playwright@1.55.0
          /tmp/practice-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check the actual live library and catalogues
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
          LIBRARY_BASE_URL: https://antlerboy.com
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node scripts/test-practice-library.js
      - name: Check the actual live relational page and original infographic
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
          RELATIONAL_BASE_URL: https://antlerboy.com
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node scripts/test-relational-guide.js
      - name: Preserve live test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-library-live-check
          path: validation/practice-library
          if-no-files-found: ignore
      - name: Preserve relational live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-live-check
          path: validation/relational
          if-no-files-found: ignore
