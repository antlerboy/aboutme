<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">Systemic consulting practice map</title><desc id="desc">Agree the work, inquire together, make sense, act and learn, and review or end. Shared responsibility, honest conversation, and client ownership run through every activity. Purpose, power, boundaries, and consequences frame the work.</desc><rect width="1200" height="1120" fill="white"/><g font-family="Carlito,Calibri,Arial,sans-serif"><text x="48" y="65" fill="#99141B" font-size="18" font-weight="bold"><tspan x="48" dy="0">SYSTEMIC CONSULTING</tspan></text><text x="48" y="119" fill="#3E0908" font-size="43" font-weight="bold"><tspan x="48" dy="0">Keep the work ownable</tspan></text><text x="48" y="161" fill="#171313" font-size="24" font-weight="normal"><tspan x="48" dy="0">Purpose, power, boundaries, and consequences shape every conversation.</tspan></text><path d="M480 314 L265 447 M263 604 L398 738 M542 805 L658 805 M992 730 L998 601 M1000 447 L752 318" fill="none" stroke="#a7a8aa" stroke-width="3"/><rect x="390" y="216" width="420" height="169" rx="10" fill="white" stroke="#99141B" stroke-width="2"/><text x="412" y="249" fill="#99141B" font-size="16" font-weight="bold"><tspan x="412" dy="0">01</tspan></text><text x="412" y="282" fill="#3E0908" font-size="28" font-weight="bold"><tspan x="412" dy="0">Agree the work</tspan></text><text x="412" y="322" fill="#171313" font-size="23" font-weight="normal"><tspan x="412" dy="0">Purpose, authority, access,</tspan><tspan x="412" dy="31.05">and mutual responsibilities.</tspan></text><rect x="48" y="410" width="364" height="195" rx="10" fill="white" stroke="#99141B" stroke-width="2"/><text x="70" y="443" fill="#99141B" font-size="16" font-weight="bold"><tspan x="70" dy="0">02</tspan></text><text x="70" y="476" fill="#3E0908" font-size="28" font-weight="bold"><tspan x="70" dy="0">Inquire together</tspan></text><text x="70" y="516" fill="#171313" font-size="23" font-weight="normal"><tspan x="70" dy="0">Whose account is missing?</tspan><tspan x="70" dy="31.05">What do we know?</tspan><tspan x="70" dy="31.05">What are we assuming?</tspan></text><rect x="788" y="410" width="364" height="195" rx="10" fill="white" stroke="#99141B" stroke-width="2"/><text x="810" y="443" fill="#99141B" font-size="16" font-weight="bold"><tspan x="810" dy="0">03</tspan></text><text x="810" y="476" fill="#3E0908" font-size="28" font-weight="bold"><tspan x="810" dy="0">Make sense</tspan></text><text x="810" y="516" fill="#171313" font-size="23" font-weight="normal"><tspan x="810" dy="0">Test the shared picture.</tspan><tspan x="810" dy="31.05">Hear disagreement.</tspan><tspan x="810" dy="31.05">Choose what to do.</tspan></text><rect x="98" y="700" width="444" height="190" rx="10" fill="white" stroke="#99141B" stroke-width="2"/><text x="120" y="733" fill="#99141B" font-size="16" font-weight="bold"><tspan x="120" dy="0">04</tspan></text><text x="120" y="766" fill="#3E0908" font-size="28" font-weight="bold"><tspan x="120" dy="0">Act and learn</tspan></text><text x="120" y="806" fill="#171313" font-size="23" font-weight="normal"><tspan x="120" dy="0">Take an ownable next step.</tspan><tspan x="120" dy="31.05">Notice effects and exceptions.</tspan><tspan x="120" dy="31.05">Build the client’s capability.</tspan></text><rect x="658" y="700" width="444" height="190" rx="10" fill="white" stroke="#99141B" stroke-width="2"/><text x="680" y="733" fill="#99141B" font-size="16" font-weight="bold"><tspan x="680" dy="0">05</tspan></text><text x="680" y="766" fill="#3E0908" font-size="28" font-weight="bold"><tspan x="680" dy="0">Review or end</tspan></text><text x="680" y="806" fill="#171313" font-size="23" font-weight="normal"><tspan x="680" dy="0">Continue, adapt, stop, or transfer.</tspan><tspan x="680" dy="31.05">Revisit the contract.</tspan><tspan x="680" dy="31.05">Leave usable learning.</tspan></text><text x="457" y="445" fill="#99141B" font-size="16" font-weight="bold"><tspan x="457" dy="0">THROUGHOUT</tspan></text><text x="457" y="486" fill="#3E0908" font-size="25" font-weight="bold"><tspan x="457" dy="0">Shared responsibility</tspan></text><text x="457" y="526" fill="#3E0908" font-size="25" font-weight="bold"><tspan x="457" dy="0">Honest conversation</tspan></text><text x="457" y="566" fill="#3E0908" font-size="25" font-weight="bold"><tspan x="457" dy="0">Client ownership</tspan></text><text x="48" y="952" fill="#171313" font-size="24" font-weight="normal"><tspan x="48" dy="0">Move between activities as the situation changes. This is not a fixed sequence.</tspan></text><text x="48" y="1001" fill="#3E0908" font-size="23" font-weight="bold"><tspan x="48" dy="0">Ask: what can I own, what must the client own, and what do we need to learn?</tspan></text><text x="48" y="1051" fill="#171313" font-size="19" font-weight="normal"><tspan x="48" dy="0">Benjamin P Taylor · Drawing on Peter Block, Barry Oshry, and systemic practice.</tspan></text><text x="48" y="1086" fill="#99141B" font-size="24" font-weight="bold"><tspan x="48" dy="0">antlerboy.com/flawfulconsulting</tspan></text></g></svg>